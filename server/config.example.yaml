# Copy to config.yaml and fill in. config.yaml is git-ignored.
owner:
  name: "Your name"
  number: "+91xxxxxxxxxx"        # main Airtel number, for SMS summaries
  say_as: ""                     # how the voice should say your name, e.g. "Uh-nee-rood-ha"

network:
  listen: "0.0.0.0"
  port: 8765
  esp_token: "change-me"
  app_token: "change-me-too"

call:
  max_seconds: 180
  speech_start_ms: 200
  end_of_turn_ms: 600
  barge_in_ms: 300
  silence_prompt_s: 6
  filler_after_ms: 3500          # "one moment please" if the reply has not started by then
  max_reply_sentences: 3
  languages: [en, hi, kn]
  default_language: en
  phrase_languages: [en]         # fixed lines (greeting, goodbye, voicemail) in English only;
                                 # add hi, kn to speak them in all three. Replies still follow the caller.
  reply_mode: scripted           # scripted: fixed professional lines, the model only reads the
                                 # call (reliable with small models); llm: the model writes replies
  scripted_languages: [hi, kn]   # Hindi/Kannada callers hear prepared replies in their language
                                 # (a 3b model writes them badly); [] lets the model reply freely.

models:
  backend: local                 # local | fake (fake needs no GPU; for development and tests)
  # Sized for a 4 GB GPU (e.g. GTX 1650). tools/doctor.py suggests sizes for yours.
  stt_english: "small"           # faster-whisper model name
  stt_indic: "ai4bharat/indic-conformer-600m-multilingual"
  llm: "qwen2.5:3b-instruct"     # Ollama model name; 7b needs about 6 GB of GPU memory
  ollama_url: "http://127.0.0.1:11434"
  tts_english: "kokoro:af_heart"  # natural voice (pip install kokoro); or a Piper file such as
                                 # "voices/en_US-lessac-medium.onnx". Try voices: tools/voice_test.py
  tts_hindi: "kokoro:hf_alpha"   # Kokoro Hindi voice; "" uses tts_indic (MMS) for Hindi too
  tts_device: "cpu"
  tts_indic: "mms"               # mms (fast, CPU) or ai4bharat/indic-parler-tts (GPU)
  device: "cuda"                 # Whisper on the GPU
  stt_compute_type: "auto"       # int8_float16 on the GPU, int8 on the CPU
  stt_indic_device: "cpu"        # IndicConformer for Hindi/Kannada
  tts_indic_device: "cpu"
  vad: silero                    # silero | energy

storage:
  database: "data/calls.db"
  audio_dir: "data/audio"
  phrase_dir: "data/phrases"
  model_dir: "data/models"
  retention_days: 30

notify:
  sms_urgent: true
  sms_high_after_minutes: 10
  sms_normal_after_minutes: 60
